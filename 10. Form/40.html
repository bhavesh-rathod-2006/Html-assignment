<!DOCTYPE html>
<html>
<head>
    <title>Search Form</title>
</head>
<body>

<form action="/search" method="get">

    <label for="search">Search Website:</label><br><br>

    <input type="search"
           id="search"
           name="search"
           placeholder="Search here..."
           autofocus><br><br>

    <input type="submit" value="Search">

</form>

</body>
</html>
