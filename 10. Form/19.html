<!DOCTYPE html>
<html>
<head>
    <title>Password Input</title>
</head>
<body>

<form>
    <label for="password">Create Password:</label><br><br>

    <input type="password"
           id="password"
           name="password"
           minlength="8"
           required
           placeholder="Minimum 8 characters">

    <br><br>
    <input type="submit" value="Submit">
</form>

</body>
</html>
