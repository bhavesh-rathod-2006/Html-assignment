<!DOCTYPE html>
<html>
<head>
    <title>formtarget Example</title>
</head>
<body>

<form action="/preview" method="get">

    <label for="article">Article Title:</label><br><br>
    <input type="text" id="article" name="article"><br><br>

    <input type="submit" value="Submit">

    <input type="submit"
           value="Preview in New Tab"
           formtarget="_blank">

</form>

</body>
</html>
