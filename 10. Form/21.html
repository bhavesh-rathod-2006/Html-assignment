<!DOCTYPE html>
<html>
<head>
    <title>Date Picker</title>
</head>
<body>

<form>
    <label for="eventdate">Select a Date in 2023:</label><br><br>

    <input type="date"
           id="eventdate"
           name="eventdate"
           min="2023-01-01"
           max="2023-12-31">

    <br><br>
    <input type="submit" value="Submit">
</form>

</body>
</html>
