<!DOCTYPE html>
<html>
<head>
    <title>Datalist Example</title>
</head>
<body>

    <form>
        <label for="browser">Choose a Browser:</label><br><br>

        <input
            type="text"
            id="browser"
            name="browser"
            list="browsers"
            placeholder="Select or type a browser">

        <datalist id="browsers">
            <option value="Google Chrome">
            <option value="Mozilla Firefox">
            <option value="Microsoft Edge">
            <option value="Safari">
            <option value="Opera">
        </datalist>
    </form>

</body>
</html>
