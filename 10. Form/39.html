<!DOCTYPE html>
<html>
<head>
    <title>File Upload Form</title>
</head>
<body>

<form action="/upload"
      method="post"
      enctype="multipart/form-data">

    <label for="resume">Upload Resume:</label><br><br>
    <input type="file"
           id="resume"
           name="resume"
           accept=".pdf,.docx"
           required><br><br>

    <label for="photo">Upload Profile Photo:</label><br><br>
    <input type="file"
           id="photo"
           name="photo"
           accept="image/*"><br><br>

    <input type="submit" value="Upload Files">

</form>

</body>
</html>
