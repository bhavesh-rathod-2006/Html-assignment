<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Default Encoding Form</title>
</head>
<body>

    <h2>Contact Form</h2>

    <form action="/submit.php"
          method="post"
          enctype="application/x-www-form-urlencoded">

        <!-- This is the default encoding type for HTML forms.
             It sends form data as key=value pairs in the request body. -->

        <label for="fullname">Full Name:</label>
        <input
            type="text"
            id="fullname"
            name="fullname"
            placeholder="Enter your full name"
            required
        >

        <br><br>

        <label for="email">Email Address:</label>
        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
        >

        <br><br>

        <input type="submit" value="Submit">

    </form>

</body>
</html>
