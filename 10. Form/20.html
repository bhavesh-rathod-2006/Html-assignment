<!DOCTYPE html>
<html>
<head>
    <title>Multiple Email Input</title>
</head>
<body>

<form>
    <label for="emails">Email Addresses:</label><br><br>

    <input type="email"
           id="emails"
           name="emails"
           multiple
           placeholder="Enter emails separated by commas">

    <br><br>
    <input type="submit" value="Send">
</form>

</body>
</html>
