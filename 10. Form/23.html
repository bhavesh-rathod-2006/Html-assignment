<!DOCTYPE html>
<html>
<head>
    <title>Volume Slider</title>
</head>
<body>

<form>
    <label for="volume">Volume:</label><br><br>

    <input type="range"
           id="volume"
           name="volume"
           min="0"
           max="100"
           value="50">

    <br><br>
    <input type="submit" value="Save Volume">
</form>

</body>
</html>
