<!DOCTYPE html>
<html>
<head>
    <title>Disabled Fieldset Example</title>
</head>
<body>

    <form>
        <fieldset disabled>
            <legend>Login Details</legend>

            <label for="username">Username:</label><br>
            <input type="text" id="username" name="username" value="Bhavesh123"><br><br>

            <label for="password">Password:</label><br>
            <input type="password" id="password" name="password" value="mypassword">
        </fieldset>
    </form>

</body>
</html>
