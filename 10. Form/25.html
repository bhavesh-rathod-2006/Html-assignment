<!DOCTYPE html>
<html>
<head>
    <title>Hidden Input Example</title>
</head>
<body>

<form action="/submit" method="post">

    <input type="hidden"
           name="sessionToken"
           value="ABC123XYZ789TOKEN">

    <label for="username">Username:</label><br><br>

    <input type="text"
           id="username"
           name="username"
           placeholder="Enter username">

    <br><br>
    <input type="submit" value="Login">
</form>

</body>
</html>
