<!DOCTYPE html>
<html>
<head>
    <title>Form Override Attributes</title>
</head>
<body>

<form action="/submit"
      method="post"
      target="_self">

    <label for="name">Name:</label><br><br>
    <input type="text" id="name" name="name" required><br><br>

    <label for="email">Email:</label><br><br>
    <input type="email" id="email" name="email" required><br><br>

    <input type="submit" value="Default Submit">

    <input type="submit"
           value="Submit to Another URL"
           formaction="/backup-submit">

    <input type="submit"
           value="Submit with GET"
           formmethod="get">

    <input type="submit"
           value="Save Draft"
           formnovalidate>

    <input type="submit"
           value="Open in New Tab"
           formtarget="_blank">

</form>

</body>
</html>
