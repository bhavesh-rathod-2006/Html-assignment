<!DOCTYPE html>
<html>
<head>
    <title>Telephone Input</title>
</head>
<body>

<form>
    <label for="phone">Phone Number:</label><br><br>

    <input type="tel"
           id="phone"
           name="phone"
           pattern="[0-9]{10}"
           placeholder="Enter a 10-digit phone number"
           required>

    <br><br>
    <input type="submit" value="Submit">
</form>

</body>
</html>
