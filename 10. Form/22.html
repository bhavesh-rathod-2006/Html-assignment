<!DOCTYPE html>
<html>
<head>
    <title>Quantity Input</title>
</head>
<body>

<form>
    <label for="quantity">Quantity (1–10):</label><br><br>

    <input type="number"
           id="quantity"
           name="quantity"
           min="1"
           max="10"
           step="1">

    <br><br>
    <input type="submit" value="Submit">
</form>

</body>
</html>
