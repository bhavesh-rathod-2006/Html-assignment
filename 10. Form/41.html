<!DOCTYPE html>
<html>
<head>
    <title>Job Application Form</title>
</head>
<body>

<form action="/job-apply"
      method="post"
      enctype="multipart/form-data">

    <fieldset>
        <legend>Personal Details</legend>

        <label for="name">Full Name:</label><br><br>
        <input type="text" id="name" name="name" required><br><br>

        <label for="email">Email:</label><br><br>
        <input type="email" id="email" name="email" required><br><br>

        <label for="phone">Phone:</label><br><br>
        <input type="tel"
               id="phone"
               name="phone"
               pattern="[0-9]{10}"
               placeholder="10-digit phone number"
               required><br><br>
    </fieldset>

    <br>

    <fieldset>
        <legend>Experience</legend>

        <label for="experience">Work Experience:</label><br><br>
        <textarea id="experience"
                  name="experience"
                  rows="5"
                  cols="50"
                  required
                  placeholder="Describe your experience"></textarea>
    </fieldset>

    <br>

    <label for="resume">Upload Resume (PDF only):</label><br><br>
    <input type="file"
           id="resume"
           name="resume"
           accept=".pdf"
           required><br><br>

    <p>Employment Type:</p>

    <input type="radio" id="fulltime" name="employment" value="Full-Time" required>
    <label for="fulltime">Full-Time</label><br>

    <input type="radio" id="parttime" name="employment" value="Part-Time">
    <label for="parttime">Part-Time</label><br>

    <input type="radio" id="internship" name="employment" value="Internship">
    <label for="internship">Internship</label><br><br>

    <input type="checkbox" id="terms" name="terms" required>
    <label for="terms">I agree to the Terms and Conditions.</label>

    <br><br>

    <input type="submit" value="Submit Application">

    <input type="submit"
           value="Save Draft"
           formnovalidate>

</form>

</body>
</html>
