<!DOCTYPE html>
<html>
<head>
    <title>Document Upload</title>
</head>
<body>

<form method="post" enctype="multipart/form-data">

    <label for="document">Upload PDF or DOCX File:</label><br><br>

    <input type="file"
           id="document"
           name="document"
           accept=".pdf,.docx"
           required>

    <br><br>
    <input type="submit" value="Upload">
</form>

</body>
</html>
