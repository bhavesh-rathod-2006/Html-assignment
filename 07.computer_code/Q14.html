<!DOCTYPE html>
<html>
<head>
    <title>Styled KBD and PRE Example</title>

    <style>
        kbd {
            background-color: #f2f2f2;
            border: 1px solid #999;
            padding: 4px 8px;
            border-radius: 5px;
            font-family: monospace;
        }

        pre {
            background-color: #1e1e1e;
            color: white;
            padding: 15px;
            border-radius: 10px;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <p>Press <kbd>Ctrl</kbd> + <kbd>S</kbd> to save the file.</p>

    <pre>
for i in range(1, 6):
    print(i)
    </pre>

</body>
</html>
