<!DOCTYPE html>
<html>

        pre {
            background-color: #1e1e1e;
            color: white;
            padding: 15px;
            border-radius: 10px;
            font-family: monospace;
        }

</head>
<body>

<pre>
for i in range(1, 6):
    print(i)
</pre>
