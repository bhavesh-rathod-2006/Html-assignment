<!DOCTYPE html>
<html>
<head>
    <title>Styled Keyboard Element</title>

    <style>
        kbd {
            background-color: #f2f2f2;
            border: 1px solid #999;
            padding: 4px 8px;
            border-radius: 5px;
            font-family: monospace;
        }
    </style>
</head>

<body>

    <p>Press <kbd>Enter</kbd> to continue.</p>

</body>
</html>
